{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TrailTap{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<header>
    <a class="brand" href="{% url 'map' %}">Trail Tap</a>
    <span class="credit">Developed by <a href="https://github.com/Andrew-liu1017" target="_blank" rel="noopener">Andrew Liu</a> · Perrysburg High School
        <span class="contrib">Contributions: Hasrith Chatla and Nathan Demtsu</span></span>
</header>
<main>
    {% block content %}{% endblock %}
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
