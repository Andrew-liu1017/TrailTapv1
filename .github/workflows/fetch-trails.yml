name: Refresh trail data

on:
  schedule:
    - cron: "17 8 * * *"   # every day, ~3-4am Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download trails from OpenStreetMap
        run: python trail/osm.py data/osm_trails.json
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm_trails.json
          git diff --cached --quiet || git commit -m "Update trail data from OpenStreetMap"
          git push
      - name: Send trails to the live site
        env:
          TRAIL_SYNC_TOKEN: ${{ secrets.TRAIL_SYNC_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TRAIL_SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @data/osm_trails.json \
            https://andrewliu1017.pythonanywhere.com/sync-trails/
